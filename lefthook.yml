# Git hooks, see AGENTS.md "提交规范".
# Installed by `pnpm install` (lefthook's postinstall runs `lefthook install`).

pre-commit:
  piped: true
  jobs:
    - name: prettier
      glob: '*.{js,mjs,cjs,ts,mts,cts,vue,json,jsonc,md,css,html,yml,yaml}'
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

    - name: eslint
      glob: '*.{js,mjs,cjs,ts,mts,cts,vue}'
      run: pnpm exec eslint --fix --no-warn-ignored {staged_files}
      stage_fixed: true

    - name: rustfmt
      glob: '*.rs'
      run: rustfmt --edition 2024 {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

pre-push:
  piped: true
  jobs:
    - name: typecheck
      run: pnpm typecheck

    - name: vitest
      run: pnpm test

    # The Rust checks take minutes; they run only when the pushed commits touch Rust code or
    # what the crates build from.
    - name: clippy
      glob: &rust
        - '*.rs'
        - '*Cargo.toml'
        - 'Cargo.lock'
        - 'rust-toolchain.toml'
        - 'rustfmt.toml'
        - '.cargo/**'
        - 'crates/**'
        - 'src-tauri/**'
      run: cargo clippy --workspace --all-targets -- -D warnings

    - name: cargo-test
      glob: *rust
      run: cargo test --workspace
