# Git hooks, see AGENTS.md "Commit conventions".
# Installed by `pnpm install` (lefthook's postinstall runs `lefthook install`).
# Full validation runs in CI; pushing does not run local checks.

pre-commit:
  piped: true
  jobs:
    - name: prettier
      glob: '*.{js,mjs,cjs,ts,mts,cts,vue,json,jsonc,md,css,html,yml,yaml}'
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

    - name: eslint
      glob: '*.{js,mjs,cjs,ts,mts,cts,vue}'
      run: pnpm exec eslint --fix --no-warn-ignored {staged_files}
      stage_fixed: true

    - name: rustfmt
      glob: '*.rs'
      run: rustfmt --edition 2024 {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
