# Builds the installers for macOS (Apple silicon), Windows (x64) and Linux (x64) with the bundled
# Python (DESIGN.md §7.3, §11.5). The release workflow calls it to fill a draft release; run by
# hand, it keeps the installers with the run as artifacts.
name: Bundle

on:
  workflow_call:
    inputs:
      ref:
        description: The commit to build
        type: string
        required: true
      release-id:
        description: The draft release that receives the installers and latest.json
        type: string
        required: true
      release-notes:
        description: The release notes, which latest.json repeats
        type: string
        default: ''
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15
          - name: Windows
            os: windows-2025
          # The oldest supported Ubuntu, so the binaries run on older glibc too.
          - name: Linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Install Tauri's system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            patchelf xdg-utils
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Lay out the bundled Python
        run: node scripts/python-runtime.mjs --github-env
      # Every decoder must load from the trimmed standard library on every platform.
      - name: Test the decoder host against it
        shell: bash
        env:
          PYTHONHOME: ${{ env.HSYNC_PYTHON_HOME }}
          HSYNC_TEST_PYTHON_HOME: ${{ env.HSYNC_PYTHON_HOME }}
        run: |
          case "$RUNNER_OS" in
            Linux) export LD_LIBRARY_PATH="$HSYNC_PYTHON_LIB" ;;
            macOS) export DYLD_LIBRARY_PATH="$HSYNC_PYTHON_LIB" ;;
            Windows) export PATH="$(cygpath -u "$HSYNC_PYTHON_LIB"):$PATH" ;;
          esac
          cargo test -p hsync-srd --locked
      - name: Check the updater key is set
        if: inputs.release-id != ''
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Releases sign their updates: set the TAURI_SIGNING_PRIVATE_KEY secret"
            exit 1
          fi
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Lets linuxdeploy find libpython while it assembles the AppImage.
          LD_LIBRARY_PATH: ${{ runner.os == 'Linux' && env.HSYNC_PYTHON_LIB || '' }}
        with:
          releaseId: ${{ inputs.release-id }}
          releaseBody: ${{ inputs.release-notes }}
          updaterJsonPreferNsis: true
          uploadWorkflowArtifacts: ${{ inputs.release-id == '' }}
          # Updater artifacts need the signing key; builds by hand without it skip them.
          args: >-
            --config ${{ env.HSYNC_PYTHON_TAURI_CONFIG }}
            ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && '--config src-tauri/tauri.updater.conf.json' || '' }}
