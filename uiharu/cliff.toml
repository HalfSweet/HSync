# Called with --include-path 'uiharu/**'; app release tags are not engine releases.

[changelog]
header = """
# Changelog
"""
body = """
{% if version -%}
## {{ version | trim_start_matches(pat="uiharu-v") }} ({{ timestamp | date(format="%Y-%m-%d") }})
{%- else -%}
## Unreleased
{%- endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/HalfSweet/HSync/commit/{{ commit.id }}))
{%- endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^revert", group = "<!-- 3 -->Reverts" },
  { message = ".*", skip = true },
]
tag_pattern = "uiharu-v[0-9]+\\.[0-9]+\\.[0-9]+.*"
skip_tags = "^v[0-9].*"
sort_commits = "oldest"
