[package]
name = "uiharu-protocols"
description = "Composable protocol decoders for the uiharu streaming decode engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
authors.workspace = true
repository = "https://github.com/HalfSweet/HSync"
homepage = "https://github.com/HalfSweet/HSync/tree/main/uiharu"
documentation = "https://docs.rs/uiharu-protocols"
readme = "README.md"
keywords = ["logic-analyzer", "protocol", "decoder", "streaming"]
categories = ["encoding", "science"]
include = ["/LICENSE", "/src/**", "/README.md"]
publish = ["crates-io"]

[dependencies]
serde.workspace = true
thiserror.workspace = true
uiharu-core = { path = "../uiharu-core", version = "0.1.0" }
uiharu-dsl-protocols = { path = "../uiharu-dsl-protocols", version = "0.1.0" }

[dev-dependencies]
# Source-checkout equivalence tests only; omitted from the published manifest.
uiharu-interp = { path = "../uiharu-interp" }
proptest.workspace = true
serde_json.workspace = true
uiharu-core = { path = "../uiharu-core", version = "0.1.0", features = ["testing"] }

[lints]
workspace = true
