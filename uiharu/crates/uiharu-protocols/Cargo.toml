[package]
name = "uiharu-protocols"
description = "Protocol decoders of the uiharu decode engine: SPI, SPI NOR, SD card SPI, I²C, 24xx EEPROM, UART, Modbus RTU, CAN, 1-Wire, DS18B20, USB, I²S, PWM, timing, parallel, JTAG and SWD, each with its contract, synthesizer and tests"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
authors.workspace = true
publish = false

[dependencies]
serde.workspace = true
thiserror.workspace = true
uiharu-core = { path = "../uiharu-core", version = "0.1.0" }

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true
uiharu-core = { path = "../uiharu-core", version = "0.1.0", features = ["testing"] }

[lints]
workspace = true
