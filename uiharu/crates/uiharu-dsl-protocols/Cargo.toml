[package]
name = "uiharu-dsl-protocols"
description = "Protocol decoders and contracts generated from the uiharu TypeScript DSL"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
authors.workspace = true
repository = "https://github.com/HalfSweet/HSync"
homepage = "https://github.com/HalfSweet/HSync/tree/main/uiharu"
documentation = "https://docs.rs/uiharu-dsl-protocols"
readme = "README.md"
keywords = ["logic-analyzer", "protocol", "decoder", "streaming"]
categories = ["encoding", "science"]
include = ["/LICENSE", "/src/**", "/README.md"]
publish = ["crates-io"]

[dependencies]
serde.workspace = true
uiharu-core = { path = "../uiharu-core", version = "0.1.0" }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
