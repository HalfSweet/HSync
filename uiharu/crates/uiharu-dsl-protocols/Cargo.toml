[package]
name = "uiharu-dsl-protocols"
description = "The protocol decoders of the uiharu decode engine generated from the decoder DSL: the reference decoders of uiharu/dsl compiled to Rust over uiharu-core's runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
authors.workspace = true
publish = false

[dependencies]
serde.workspace = true
uiharu-core = { path = "../uiharu-core", version = "0.1.0" }

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true
uiharu-core = { path = "../uiharu-core", version = "0.1.0", features = ["testing"] }
uiharu-protocols = { path = "../uiharu-protocols", version = "0.1.0" }

[lints]
workspace = true
