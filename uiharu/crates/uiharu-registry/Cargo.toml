[package]
name = "uiharu-registry"
description = "Named protocol decoders, UI metadata and configurable pipelines for uiharu"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
authors.workspace = true
repository = "https://github.com/HalfSweet/HSync"
homepage = "https://github.com/HalfSweet/HSync/tree/main/uiharu"
documentation = "https://docs.rs/uiharu-registry"
readme = "README.md"
keywords = ["logic-analyzer", "protocol", "decoder", "streaming"]
categories = ["encoding", "science"]
include = ["/LICENSE", "/src/**", "/README.md", "/manifests/**"]
publish = ["crates-io"]

[dependencies]
indexmap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uiharu-core = { path = "../uiharu-core", version = "0.1.0" }
uiharu-interp = { path = "../uiharu-interp", version = "0.1.0" }
uiharu-ir = { path = "../uiharu-ir", version = "0.1.0" }
uiharu-protocols = { path = "../uiharu-protocols", version = "0.1.0" }

[lints]
workspace = true
