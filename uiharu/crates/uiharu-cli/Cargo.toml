[package]
name = "uiharu-cli"
description = "A command line for streaming protocol decoding, synthesis and benchmarks"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
authors.workspace = true
repository = "https://github.com/HalfSweet/HSync"
homepage = "https://github.com/HalfSweet/HSync/tree/main/uiharu"
documentation = "https://docs.rs/uiharu-cli"
readme = "README.md"
keywords = ["logic-analyzer", "protocol", "decoder", "streaming"]
categories = ["encoding", "science"]
include = ["/LICENSE", "/src/**", "/README.md"]
publish = ["crates-io"]

[[bin]]
name = "uiharu"
path = "src/main.rs"

[dependencies]
indexmap.workspace = true
serde.workspace = true
serde_json.workspace = true
uiharu-core = { path = "../uiharu-core", version = "0.1.0" }
uiharu-protocols = { path = "../uiharu-protocols", version = "0.1.0" }
uiharu-registry = { path = "../uiharu-registry", version = "0.1.0" }

[lints]
workspace = true
