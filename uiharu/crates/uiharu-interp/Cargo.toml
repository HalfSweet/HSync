[package]
name = "uiharu-interp"
description = "An interpreter for the uiharu decoder intermediate representation"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
authors.workspace = true
repository = "https://github.com/HalfSweet/HSync"
homepage = "https://github.com/HalfSweet/HSync/tree/main/uiharu"
documentation = "https://docs.rs/uiharu-interp"
readme = "README.md"
keywords = ["logic-analyzer", "protocol", "decoder", "streaming"]
categories = ["encoding", "science"]
include = ["/LICENSE", "/src/**", "/README.md"]
publish = ["crates-io"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uiharu-core = { path = "../uiharu-core", version = "0.1.0" }
uiharu-ir = { path = "../uiharu-ir", version = "0.1.0" }

[dev-dependencies]
proptest.workspace = true
uiharu-core = { path = "../uiharu-core", version = "0.1.0", features = ["testing"] }
# Source-checkout equivalence tests only; omitted from the published manifest to
# avoid a first-publish cycle with the protocol library.
uiharu-protocols = { path = "../uiharu-protocols" }

[lints]
workspace = true
