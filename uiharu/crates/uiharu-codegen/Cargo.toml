[package]
name = "uiharu-codegen"
description = "A Rust code generator for the uiharu decoder intermediate representation"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
authors.workspace = true
repository = "https://github.com/HalfSweet/HSync"
homepage = "https://github.com/HalfSweet/HSync/tree/main/uiharu"
documentation = "https://docs.rs/uiharu-codegen"
readme = "README.md"
keywords = ["logic-analyzer", "protocol", "decoder", "streaming"]
categories = ["encoding", "science"]
include = ["/LICENSE", "/src/**", "/README.md"]
publish = ["crates-io"]

[[bin]]
name = "uiharu-codegen"
path = "src/main.rs"

[dependencies]
serde_json.workspace = true
thiserror.workspace = true
uiharu-ir = { path = "../uiharu-ir", version = "0.1.0" }

[lints]
workspace = true
