[package]
name = "uiharu-codegen"
description = "The backend of the uiharu decoder DSL: emits Rust over uiharu-core's runtime from the decoder IR"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
authors.workspace = true
publish = false

[[bin]]
name = "uiharu-codegen"
path = "src/main.rs"

[dependencies]
serde_json.workspace = true
thiserror.workspace = true
uiharu-ir = { path = "../uiharu-ir", version = "0.1.0" }

[lints]
workspace = true
