[package]
name = "uiharu-ir"
description = "The versioned decoder intermediate representation of the uiharu decode engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
authors.workspace = true
repository = "https://github.com/HalfSweet/HSync"
homepage = "https://github.com/HalfSweet/HSync/tree/main/uiharu"
documentation = "https://docs.rs/uiharu-ir"
readme = "README.md"
keywords = ["logic-analyzer", "protocol", "decoder", "streaming"]
categories = ["encoding", "science"]
include = ["/LICENSE", "/src/**", "/README.md"]
publish = ["crates-io"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[lints]
workspace = true
