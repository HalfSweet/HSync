# Release notes and CHANGELOG.md from the conventional commits (AGENTS.md "Releasing"): features,
# fixes, performance work and reverts, grouped; the rest of the history stays out of them.

[changelog]
header = """
# Changelog
"""
body = """
{% if version -%}
## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }})
{%- else -%}
## Unreleased
{%- endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}{% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/HalfSweet/HSync/commit/{{ commit.id }}))
{%- endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^revert", group = "<!-- 3 -->Reverts" },
  { message = ".*", skip = true },
]
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+.*"
sort_commits = "oldest"
