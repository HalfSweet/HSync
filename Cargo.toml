[workspace]
resolver = "3"
# The uiharu decode engine (uiharu/) is Apache-2.0 and must not depend on the hsync crates.
members = ["crates/*", "src-tauri", "uiharu/crates/*"]

[workspace.package]
version = "0.1.4"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0 OR GPL-3.0-or-later"
authors = ["HalfSweet"]
publish = false

[workspace.dependencies]
crossbeam-channel = "0.5.17"
fst-writer = "0.3.1"
futures-lite = "2.6.1"
log = "0.4.34"
nusb = "0.2.7"
parking_lot = "0.12.5"
proptest = "1.11.0"
# Embeds CPython for the sigrok decoders; 0.29.3 is still too new to take.
pyo3 = "=0.29.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
thiserror = "2.0.21"
tracing = "0.1.44"
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
# Reads VCD, FST and GHW waveforms; the time grid they are laid on is ours.
wellen = "0.25.6"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

hsync-core = { path = "crates/hsync-core" }
hsync-atklogic = { path = "crates/hsync-atklogic" }
hsync-capture = { path = "crates/hsync-capture" }
hsync-decode = { path = "crates/hsync-decode" }
hsync-demo = { path = "crates/hsync-demo" }
hsync-driver = { path = "crates/hsync-driver" }
hsync-dslogic = { path = "crates/hsync-dslogic" }
hsync-fileio = { path = "crates/hsync-fileio" }
hsync-pxlogic = { path = "crates/hsync-pxlogic" }
hsync-session = { path = "crates/hsync-session" }
hsync-srd = { path = "crates/hsync-srd" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

# Capture processing and decoding are hot loops; keep dev builds usable.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
